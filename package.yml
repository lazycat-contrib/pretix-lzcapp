format_version: 3
package:
  name: "Pretix"
  slug: pretix
  app_id: pretix
  version: 2026.9.0
  author: ramielcreations
  category: developer_tools
  tagline: "开源的票务与活动管理平台"
  tags: [ticketing, events, python]
  license: AGPL-3.0
  description: |
    Pretix 是一个功能完整的开源票务平台，支持多活动、多票种、
    订单管理、check-in、报表等功能，由 pretix GmbH 维护。

update:
  allow_downgrade: false
  targets:
    - id: pretix
      target: service
      service: pretix
      source: pretix/standalone
      channel: stable
      sort: semver
      tag_regex: ^[0-9]+[.][0-9]+[.][0-9]+$
      delivery:
        mode: mirror
        require_digest_match: true
    - id: postgres
      target: service
      service: pretix-db
      source: library/postgres
      channel: custom
      sort: semver
      tag_regex: ^1[67][.][0-9]+$
      version_regex: ^(?P<version>1[67][.][0-9]+)$
      version_template: "{version}.0"
      delivery:
        mode: mirror
        require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: pretix
    skip_if_version_exists: true
